[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codealpha-disease-prediction"
version = "0.1.0"
description = "Breast Cancer Wisconsin Disease Prediction (CodeAlpha ML Internship)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<4.0",
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<4.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.3,<2.0",
    "streamlit>=1.35,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests that run full dataset training and evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
